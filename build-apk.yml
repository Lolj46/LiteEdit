name: Build LiteEdit APK

on:
  push:
    branches: [main]
    paths:
      - 'LiteEdit_0.3_source_pack.zip'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare Gradle project from source archive
        run: bash scripts/prepare_project.sh

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package generated Gradle project
        if: success()
        run: |
          zip -qr "$GITHUB_WORKSPACE/LiteEdit-Android-Project.zip" \
            settings.gradle.kts build.gradle.kts gradle.properties app README_RU.md \
            -x 'app/build/*' 'app/.gradle/*'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiteEdit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete Android project
        uses: actions/upload-artifact@v4
        with:
          name: LiteEdit-Android-Project
          path: LiteEdit-Android-Project.zip
          if-no-files-found: error
          retention-days: 14
